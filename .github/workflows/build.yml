name: Build and Deploy

on:
  push:
    branches: [main]
  # The front page shows the quote dated today, so the site must be
  # rebuilt as the UTC day turns. Without this it would freeze on
  # whatever day the last push happened.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install ssg
        run: cargo binstall --no-confirm ssg

      - name: Build site
        run: bash build.sh

      # Guard the deploy: publishing an empty or half-built tree would
      # replace a working site with nothing, and force_orphan means
      # there is no previous commit on gh-pages to fall back to.
      - name: Verify build output
        run: |
          test -f public/index.html || { echo "::error::public/index.html missing"; exit 1; }
          test -f public/archive.html || { echo "::error::public/archive.html missing"; exit 1; }
          test -s public/CNAME || { echo "::error::public/CNAME missing or empty"; exit 1; }
          pages=$(find public -name '*.html' | wc -l | tr -d ' ')
          echo "built ${pages} pages"
          [ "$pages" -ge 60 ] || { echo "::error::only ${pages} pages built, expected >= 60"; exit 1; }
          grep -q '<blockquote>' public/index.html || { echo "::error::index.html has no rendered quote"; exit 1; }
          # The front page must show today's date, not a stale one — the
          # original bug was a page dated 2024 being served as "today".
          today=$(date -u +%-d\ %B\ %Y)
          grep -q "$today" public/index.html || { echo "::error::index.html does not show today ($today)"; exit 1; }
          # ssg's own sitemap plugin emits an empty urlset on a clean
          # build, which is invisible unless asserted on.
          urls=$(grep -c '<url>' public/sitemap.xml || true)
          echo "sitemap urls: ${urls}"
          [ "$urls" -ge 60 ] || { echo "::error::sitemap has ${urls} urls, expected >= 60"; exit 1; }
          test ! -e public/.ssg-cache || { echo "::error::build cache would be published"; exit 1; }
          # The search widget is part of the design; it is useless without
          # its index, and an empty index fails silently in the browser.
          entries=$(python3 -c "import json;print(len(json.load(open('public/search-index.json'))['entries']))")
          echo "search index entries: ${entries}"
          [ "$entries" -ge 60 ] || { echo "::error::search index has ${entries} entries"; exit 1; }

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy site from ${{ github.sha }}"
