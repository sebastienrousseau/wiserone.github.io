<!DOCTYPE html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{permalink}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{permalink}}">
  <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://cloudcdn.pro" crossorigin>
  <link rel="dns-prefetch" href="https://cloudcdn.pro">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="https://cloudcdn.pro/clients/wiserone/v1/icons/180x180.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme-init.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">The Wiser One</a>
      <nav class="site-nav" aria-label="Primary">
        <ul class="nav-menu">
          <li><a class="nav-link" href="/">Today</a></li>
          <li><a class="nav-link" href="/archive.html">Archive</a></li>
          <li><a class="nav-link" href="/about.html">About</a></li>
        </ul>
        <button class="theme-toggle" id="themeToggle" type="button"><span class="mode-to-dark">Dark mode</span><span class="mode-to-light">Light mode</span></button>
      </nav>
    </div>
  </header>

  <main id="main">
    {{content}}
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 {{author}} &middot; <a href="https://static-site-generator.com/">SSG</a></p>
  </footer>
  <script src="/main.js"></script>
</body>
</html>
